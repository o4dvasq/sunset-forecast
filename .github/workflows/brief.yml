name: brief

# Writes the brief for 5:00 am and 3:30 pm Pacific, sends it by Telegram and
# publishes it to the `brief` branch.
# GitHub cron is UTC and can start late, so each edition runs 15 minutes early,
# at both the daylight-time and the standard-time hour. The script sends only
# inside the window around the target time and only once per edition, so the
# run that lands an hour off stays quiet.
on:
  schedule:
    - cron: '45 11,12 * * *' # 4:45 am PDT and 4:45 am PST
    - cron: '15 22,23 * * *' # 3:15 pm PDT and 3:15 pm PST
  workflow_dispatch:
    inputs:
      edition:
        description: 'morning or evening (blank picks by the clock)'
        required: false
        default: ''
      force_send:
        description: 'send now, ignoring the time window'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start from the files already published
        run: |
          mkdir -p out
          if git fetch --depth 1 origin brief 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Write the brief
        env:
          EDITION: ${{ inputs.edition }}
          FORCE_SEND: ${{ inputs.force_send }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -- --out out --send
          if [ -n "$EDITION" ]; then set -- "$@" --edition "$EDITION"; fi
          if [ "$FORCE_SEND" = "true" ]; then set -- "$@" --force-send; fi
          node scripts/brief.mjs "$@"

      - name: Publish to the brief branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b brief
          git config user.name "sunset-forecast brief"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Brief $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" brief

      # GitHub disables scheduled workflows in a repository with no activity
      # for 60 days; re-enabling on every run keeps the schedule alive.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/brief.yml/enable"
